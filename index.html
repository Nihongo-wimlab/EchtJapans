    const fetchWithRetry = async (url, options, retries = 3, delay = 1500) => {
      try {
        const response = await fetch(url, options);
        if (!response.ok) {
          const errorData = await response.json().catch(() => ({}));
          throw new Error(errorData?.error?.message || `HTTP error! status: ${response.status}`);
        }
        return response;
      } catch (error) {
        if (retries > 0) {
          await new Promise(resolve => setTimeout(resolve, delay));
          return fetchWithRetry(url, options, retries - 1, delay * 2);
        }
        throw error;
      }
    };

    const builtInCharacters = [
      { id: 'classmate_yuki', name: 'Yuki-chan', role: 'Nieuwe Klasgenoot', emoji: '🏫', desc: 'Je nieuwe klasgenoot. Stel jezelf voor!', systemPrompt: "Jij bent Yuki, een 14-jarige Japanse scholiere. Je bent erg vrolijk en spreekt héél simpel Japans (Strict A1 niveau). Gebruik voornamelijk hiragana/katakana.", level: 'A1', register: 'Informeel', initialMessage: { kanji: 'こんにちは！私はゆきです。お名前は何ですか。', kana: 'こんにちは！わたしは ゆきです。おなまえは なんですか。', romaji: 'Konnichiwa! Watashi wa Yuki desu. Onamae wa nan desu ka.', translation: 'Hallo! Ik ben Yuki. Wat is jouw naam?' } },
      { id: 'shop_ken', name: 'Ken-kun', role: 'Anime Winkel', emoji: '🛍️', desc: 'Verkoper in een coole manga & anime winkel.', systemPrompt: "Jij bent Ken, een jonge verkoper in een anime winkel.", level: 'A1', register: 'Formeel', initialMessage: { kanji: 'いらっしゃいませ！何をお探しですか。', kana: 'いらっしゃいませ！なにを おさがしですか。', romaji: 'Irasshaimase! Nani o osagashi desu ka.', translation: 'Welkom! Wat zoek je?' } },

      { label: "Praten over lievelingseten", name: "Yumi", role: "Schoolkantine", systemPrompt: "Je zit in de pauze met Yumi. Praat over welk eten jullie lekker vinden." }
    ];

    const downloadJsonFile = async (data, filename) => {
      const jsonStr = JSON.stringify(data, null, 2);
      try {
        const file = new File([jsonStr], filename, { type: 'application/json' });
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          await navigator.share({ files: [file], title: filename });
          return;
        }
      } catch (err) {}
      
      const blob = new Blob([jsonStr], { type: 'application/octet-stream' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.style.display = 'none';
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 300);
    };

    const App = () => {
      const [userRole, setUserRole] = useState(null);
      const [view, setView] = useState('role_select');
      const [selectedCharacter, setSelectedCharacter] = useState(null);
      const [history, setHistory] = useState([]);
      
      const [customScenarios, setCustomScenarios] = useState(() => {
        try {

          return local ? JSON.parse(local) : [];
        } catch (e) { return []; }
      });
      
      const [vocabulary, setVocabulary] = useState(() => {
        try {
          const local = localStorage.getItem(`${appId}_saved_vocabulary`);
          return local ? [...defaultVocabulary, ...JSON.parse(local)] : defaultVocabulary;
        } catch (e) { return defaultVocabulary; }
      });

      const [savedDialogues, setSavedDialogues] = useState(() => {

          const local = localStorage.getItem(`${appId}_saved_dialogues`);
          return local ? JSON.parse(local) : [];
        } catch (e) { return []; }
      });

      const [notification, setNotification] = useState(null);
      const showNotification = (msg, type = 'success') => {
        setNotification({ msg, type });
        setTimeout(() => setNotification(null), 3500);
      };
      
      const [vocabDisplayMode, setVocabDisplayMode] = useState({ furigana: true, translation: true, romaji: false });
      const [displayMode, setDisplayMode] = useState({ kanji: false, kana: true, romaji: false, translation: true });
      
      const [isLoading, setIsLoading] = useState(false);
      const [inputText, setInputText] = useState('');
      const [customChar, setCustomChar] = useState({ scenarioName: '', name: '', role: '', systemPrompt: '', level: 'A1', register: 'Informeel' });
      const [expandedScenarios, setExpandedScenarios] = useState({});
      const [isExtractingVocab, setIsExtractingVocab] = useState(false);
      const [vocabSuccessMessage, setVocabSuccessMessage] = useState('');

      const [activeMessageIndex, setActiveMessageIndex] = useState(null);
      const [showBackup, setShowBackup] = useState(false);
      const [isCopied, setIsCopied] = useState(false);
      const [copiedScenario, setCopiedScenario] = useState(null);
      const [appErrorMessage, setAppErrorMessage] = useState(null);
      
      const [isSavingDialogue, setIsSavingDialogue] = useState(false);
      const [dialogueSuccessMsg, setDialogueSuccessMsg] = useState('');
      const [expandedDialogues, setExpandedDialogues] = useState({});

      const [suggestedResponses, setSuggestedResponses] = useState([]);
      const [isGeneratingSuggestions, setIsGeneratingSuggestions] = useState(false);
      const [grammarCheckResult, setGrammarCheckResult] = useState(null);
      const [isCheckingGrammar, setIsCheckingGrammar] = useState(false);
      
      const [etiquetteTip, setEtiquetteTip] = useState(null);
      const [isFetchingEtiquette, setIsFetchingEtiquette] = useState(false);
      const [evaluationResult, setEvaluationResult] = useState(null);
      const [isEvaluating, setIsEvaluating] = useState(false);

      const [revealedRomaji, setRevealedRomaji] = useState({});
      
      const [editingCustomId, setEditingCustomId] = useState(null);
      const [editingCustomName, setEditingCustomName] = useState('');
      const [editingDialogueId, setEditingDialogueId] = useState(null);
      const [editingDialogueName, setEditingDialogueName] = useState('');

      const [deleteConfirm, setDeleteConfirm] = useState(null);
      const [editScenarioId, setEditScenarioId] = useState(null);

      const [editingMsgIndex, setEditingMsgIndex] = useState(null);
      const [editingMsgContent, setEditingMsgContent] = useState({ kana: '', romaji: '', translation: '', kanji: '' });

      const [editingDiagMsgKey, setEditingDiagMsgKey] = useState(null); 
      const [editingDiagMsgContent, setEditingDiagMsgContent] = useState({ kana: '', romaji: '', translation: '', kanji: '' });

      const [isAutoTranslating, setIsAutoTranslating] = useState(false);

      const fileInputRef = useRef(null);
      const dialogueFileInputRef = useRef(null);
      const playbackIdRef = useRef(0);

      const toggleRomaji = (id, globalMode) => {
        setRevealedRomaji(prev => {
          const currentState = prev[id] !== undefined ? prev[id] : globalMode;
          return { ...prev, [id]: !currentState };
        });
      };

      const isRomajiVisible = (id, globalMode) => {
        return revealedRomaji[id] !== undefined ? revealedRomaji[id] : globalMode;
      };

      useEffect(() => {
        window.speechSynthesis?.getVoices();
      }, []);

      const stopAudio = () => {
        window.speechSynthesis?.cancel();
        playbackIdRef.current++;
        setIsPlaying(false);
        setActiveMessageIndex(null);
      };

      const playJapaneseText = (text, index = null) => {
        if (!text || !window.speechSynthesis) return;
        window.speechSynthesis.cancel();
        if (index !== null) setActiveMessageIndex(index);
        
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'ja-JP';
        utterance.rate = 0.85; 
        
        const voices = window.speechSynthesis.getVoices();
        const kyoko = voices.find(v => v.name.includes('Kyoko'));
        const anyJp = voices.find(v => v.lang.includes('ja'));
        if (kyoko) utterance.voice = kyoko;
        else if (anyJp) utterance.voice = anyJp;
        
        utterance.onend = () => { setIsPlaying(false); setActiveMessageIndex(null); };
        utterance.onerror = () => { setIsPlaying(false); setActiveMessageIndex(null); };
        
        setIsPlaying(true);
        window.speechSynthesis.speak(utterance);
      };

      const playFullDialogue = async () => {
        if (!window.speechSynthesis) return;
        window.speechSynthesis.cancel();
        playbackIdRef.current++;
        const currentPlaybackId = playbackIdRef.current;
        setIsPlaying(true);
        setActiveMessageIndex(null);
        
        const voices = window.speechSynthesis.getVoices();
        const kyoko = voices.find(v => v.name.includes('Kyoko'));
        const anyJp = voices.find(v => v.lang.includes('ja'));
        const voiceToUse = kyoko || anyJp;
        
        for (let index = 0; index < history.length; index++) {
          if (currentPlaybackId !== playbackIdRef.current) return;
          
          const h = history[index];
          const text = h.content.kana || h.content.kanji;
          if (!text) continue;
          
          setActiveMessageIndex(index);
          const msgElement = document.getElementById(`chat-msg-${index}`);
          if (msgElement) msgElement.scrollIntoView({ behavior: 'smooth', block: 'center' });
          
          await new Promise((resolve) => {
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'ja-JP';
            utterance.rate = 0.85;
            if (voiceToUse) utterance.voice = voiceToUse;
            utterance.onend = resolve;
            utterance.onerror = resolve;
            window.speechSynthesis.speak(utterance);
          });
          
          if (currentPlaybackId !== playbackIdRef.current) return;
          if (index < history.length - 1) await new Promise(resolve => setTimeout(resolve, 800));
        }
        
        if (currentPlaybackId === playbackIdRef.current) {
          setIsPlaying(false);
          setActiveMessageIndex(null);
        }
      };

      const toggleScenario = (scenario) => setExpandedScenarios(prev => ({...prev, [scenario]: !prev[scenario]}));

      const deleteWord = (id) => {
        const localVocab = vocabulary.filter(v => v.docId !== id && v.id !== id);

        showNotification("Woord verwijderd!", "info");
      };

      const addWordToStateAndStorage = (nw) => {
        const localId = `local-v-${Date.now()}-${Math.random().toString(36).substr(2, 6)}`;

        setVocabulary(prev => {
          const updated = [...prev, wordWithId];
          const onlyCustom = updated.filter(v => !defaultVocabulary.some(dv => dv.id === v.id));
          localStorage.setItem(`${appId}_saved_vocabulary`, JSON.stringify(onlyCustom));
          return updated;
        });
      };

      const generateMoreWords = async (scenario) => {
        setIsLoading(true);
        try {
          if (!apiKey) throw new Error("Geen API key ingesteld.");
          const prompt = `Geef 5 nieuwe, super simpele Japanse woorden/zinnen (A1 niveau) voor scenario '${scenario}'. JSON array: [{"kanji": "...", "furigana": "...", "romaji": "...", "translation": "...", "example1": "...", "example1Romaji": "...", "example1Trans": "...", "example2": "...", "example2Romaji": "...", "example2Trans": "..."}]`;
          const response = await fetchWithRetry(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
          });
          const result = await response.json();
          const responseText = result?.candidates?.[0]?.content?.parts?.[0]?.text;
          const jsonStr = responseText.replace(/```json|```/g, '').trim();
          const newWords = JSON.parse(jsonStr).map((w, i) => ({ ...w, id: `v-gen-${Date.now()}-${i}`, scenario }));
          newWords.forEach(nw => addWordToStateAndStorage(nw));
          showNotification(`${newWords.length} nieuwe woorden toegevoegd! ✨`, "success");
        } catch (e) {
          showNotification("API niet geconfigureerd of mislukt. Geen nieuwe AI woorden gegeneerd.", "info");
        } finally { setIsLoading(false); }
      };

      const exportScenario = (scenario) => {
        const data = vocabulary.filter(v => v.scenario === scenario);
        const dateStr = new Date().toISOString().split('T')[0];
        downloadJsonFile(data, `Japans_A1_vocab_${scenario.toLowerCase()}_${dateStr}.json`);
      };

      const copyScenarioVocabulary = (scenario) => {
        const data = vocabulary.filter(v => v.scenario === scenario);
        let text = `🌸 [Scenario: ${scenario}] 🌸\n\n`;
        data.forEach((v) => {
          text += `${v.kanji} (${v.furigana})\n${v.romaji}\n${v.translation}\n`;
          if (v.example1) text += `Voorbeeld 1: ${v.example1}\n${v.example1Trans}\n${v.example1Romaji}\n`;
          if (v.example2) text += `Voorbeeld 2: ${v.example2}\n${v.example2Trans}\n${v.example2Romaji}\n\n`;
        });
        const textArea = document.createElement("textarea"); textArea.value = text;
        document.body.appendChild(textArea); textArea.select();
        try {
          document.execCommand('copy'); setCopiedScenario(scenario);
          showNotification("Woordenlijst gekopieerd naar klembord! 📋", "success");
          setTimeout(() => setCopiedScenario(null), 2000);
        } catch (err) {}
        document.body.removeChild(textArea);
      };

      const importScenario = (scenario) => {
        const input = document.createElement('input'); input.type = 'file'; input.accept = '.json';
        input.onchange = (e) => {
          const file = e.target.files?.[0]; if (!file) return;
          const r = new FileReader();
          r.onload = (ev) => {
            try {
              const data = JSON.parse(ev.target.result);
              let importedCount = 0;
              for (const newV of data) {
                if(!vocabulary.find(oldV => oldV.kanji === newV.kanji && oldV.scenario === scenario)) {
                  addWordToStateAndStorage({ ...newV, scenario });
                  importedCount++;
                }
              }
              showNotification(`${importedCount} kaartjes geïmporteerd! 📥✨`, "success");
            } catch(err) { setAppErrorMessage("Import mislukt: Ongeldig JSON bestand."); }
          };
          r.readAsText(file);
        }; input.click();
      };

      const exportAllVocabulary = () => {
        downloadJsonFile(vocabulary, `Echt_Japans_A1_Alle_Woorden_${new Date().toISOString().split('T')[0]}.json`);
      };

      const importAllVocabulary = () => {
        const input = document.createElement('input'); input.type = 'file'; input.accept = '.json';
        input.onchange = (e) => {
          const file = e.target.files?.[0]; if (!file) return;
          const r = new FileReader();
          r.onload = (ev) => {
            try {
              const data = JSON.parse(ev.target.result);
              data.forEach(newV => addWordToStateAndStorage(newV));
              showNotification(`${data.length} kaartjes geïmporteerd! 📥✨`, "success");
            } catch(err) { setAppErrorMessage("Import mislukt: Ongeldig JSON bestand."); }
          }; r.readAsText(file);
        }; input.click();
      };

      const handleDuplicateScenario = (s) => {
        const newScenario = {
          id: `local-sc-${Date.now()}`,
          scenarioName: `${s.scenarioName || s.role || 'Scenario'} (Kopie)`,
          name: s.name || '',

          systemPrompt: s.systemPrompt || '',
          level: s.level || 'A1',
          register: s.register || 'Informeel',
          sortOrder: customScenarios.length,
          isFavorite: false
        };
        const updated = [...customScenarios, newScenario];
        setCustomScenarios(updated);
        localStorage.setItem(`${appId}_custom_scenarios`, JSON.stringify(updated));
        showNotification("Scenario gedupliceerd! 💾✨", "success");

        const updated = customScenarios.map(sc => sc.id === s.id ? { ...sc, isFavorite: !sc.isFavorite } : sc);

        localStorage.setItem(`${appId}_custom_scenarios`, JSON.stringify(updated));

                  showNotification("Scenario opgeslagen! ✨", "success");
                  setView('characters');
                }} className="flex-[2] bg-gradient-to-r from-pink-400 to-purple-500 text-white p-4 rounded-2xl font-black text-sm shadow-md">
                  Opslaan! ✨
                </button>
              </div>
            </div>
          )}

          {/* VIEW: Live Chat */}
          {view === 'chat' && selectedCharacter && (
            <div className="w-full max-w-lg flex flex-col flex-1 pb-10">
              <div className={`flex justify-between items-center mb-3 font-black ${userRole === 'leerling' ? 'text-teal-800' : 'text-purple-700'} bg-white/70 backdrop-blur px-4 py-2.5 rounded-2xl shadow-sm`}>
                <div className="flex items-center gap-2">
                  <span className="text-xl">{selectedCharacter.emoji || '🗣️'}</span>
                  <span>Chat met {selectedCharacter.name} ({selectedCharacter.level || 'A1'})</span>
                </div>
                <button onClick={() => setView('dialogues')} className={`bg-white p-1 rounded-full ${userRole === 'leerling' ? 'text-teal-500' : 'text-pink-400'}`}><X size={20}/></button>
              </div>
              
              <div className="flex justify-between gap-2 mb-3 items-center">
                <div className="flex gap-3 flex-wrap p-3 bg-white/90 rounded-2xl shadow-sm border border-teal-100 flex-1 justify-center">
                  {['kana', 'romaji', 'translation', 'kanji'].map(mode => (
                    <label key={`display-mode-${mode}`} className={`flex items-center gap-1.5 text-[10px] font-black uppercase cursor-pointer ${userRole === 'leerling' ? 'text-teal-700' : 'text-purple-600'}`}>
                      <input type="checkbox" checked={displayMode[mode]} onChange={() => setDisplayMode(p => ({...p, [mode]: !p[mode]}))} className="accent-teal-500 w-3.5 h-3.5"/> 
                      {mode === 'translation' ? 'NL' : mode}
                    </label>
                  ))}
                </div>
                
                <button onClick={getEtiquetteTip} disabled={isFetchingEtiquette} className="p-3 bg-gradient-to-br from-cyan-300 to-blue-400 text-white rounded-2xl flex items-center justify-center shadow-md disabled:opacity-50" title="Weetje over Japan!">
                  {isFetchingEtiquette ? <Loader2 size={20} className="animate-spin" /> : <Globe size={20} />}
                </button>
              </div>

              {etiquetteTip && (
                <div className="mb-3 bg-blue-50 border-2 border-blue-200 p-4 rounded-3xl relative shadow-sm">
                  <button onClick={() => setEtiquetteTip(null)} className="absolute top-3 right-3 text-blue-400 bg-white rounded-full p-1"><X size={14}/></button>
                  <div className="text-xs font-black text-blue-600 mb-2 flex items-center gap-1 uppercase tracking-wider"><Sparkles size={14}/> Cool Weetje!</div>
                  <div className="text-sm text-slate-700 font-medium">{etiquetteTip}</div>
                </div>
              )}

              {/* Complete Dialogue History Window */}
              <div className="space-y-4 p-4 bg-white/60 backdrop-blur-sm border border-purple-50 rounded-3xl mb-4 shadow-inner">
                {history.map((h, i) => {
                  const isEditing = editingMsgIndex === i;
                  return (
                    <div key={`chat-msg-container-${i}`} id={`chat-msg-${i}`} className={`p-4 rounded-3xl max-w-[85%] text-sm relative shadow-sm border ${activeMessageIndex === i ? 'ring-4 ring-yellow-400 scale-[1.02]' : ''} ${h.role === 'user' ? 'bg-gradient-to-br from-cyan-400 to-blue-500 text-white ml-auto rounded-tr-sm border-blue-300' : 'bg-white text-purple-900 mr-auto rounded-tl-sm border-pink-200'} ${isEditing ? 'w-full max-w-[95%] bg-white text-slate-800' : ''}`}>
                      {isEditing && userRole !== 'leerling' ? (
                        <div className="space-y-2 text-slate-800">
                          <div className="text-[10px] font-black uppercase text-pink-500 mb-1">Bericht bewerken</div>
                          <div>
                            <label className="text-[9px] font-bold text-slate-400 uppercase">Japans (Kana)</label>
                            <input value={editingMsgContent.kana} onChange={e => setEditingMsgContent({...editingMsgContent, kana: e.target.value})} className="w-full p-2 text-sm rounded-xl border border-purple-200 bg-purple-50/50" />
                          </div>
                          <div>
                            <label className="text-[9px] font-bold text-slate-400 uppercase">Romaji</label>
                            <input value={editingMsgContent.romaji} onChange={e => setEditingMsgContent({...editingMsgContent, romaji: e.target.value})} className="w-full p-2 text-sm rounded-xl border border-purple-200 bg-purple-50/50" />
                          </div>
                          <div>
                            <label className="text-[9px] font-bold text-slate-400 uppercase">Vertaling (NL)</label>
                            <input value={editingMsgContent.translation} onChange={e => setEditingMsgContent({...editingMsgContent, translation: e.target.value})} className="w-full p-2 text-sm rounded-xl border border-purple-200 bg-purple-50/50" />
                          </div>
                          <div className="flex gap-2 justify-end pt-2">
                            <button onClick={() => setEditingMsgIndex(null)} className="px-3 py-1.5 text-xs font-bold bg-slate-100 text-slate-500 rounded-xl">Annuleren</button>
                            <button onClick={saveEditedMessage} className="px-3 py-1.5 text-xs font-black bg-pink-500 text-white rounded-xl flex items-center gap-1"><Check size={12}/> Opslaan</button>
                          </div>
                        </div>
                      ) : (
                        <>
                          <div className="flex justify-between items-start mb-1">
                            <div className="font-black opacity-80 text-[10px] uppercase tracking-wider">{h.role === 'user' ? 'Ik' : selectedCharacter.name}</div>
                            <div className="flex items-center gap-2">
                              <button onClick={() => handleSenseiClick(h.content)} className={`flex items-center gap-1 text-[10px] font-black uppercase px-2 py-0.5 rounded-full ${h.role === 'user' ? 'bg-blue-400 text-white' : 'bg-pink-100 text-pink-600'}`} title="Vraag de Sensei">
                                <GraduationCap size={12}/> Sensei
                              </button>
                              <button onClick={() => playJapaneseText(h.content.kana || h.content.kanji, i)} className={`${h.role === 'user' ? 'text-blue-100' : 'text-pink-300'}`}>
                                <Volume2 size={16}/>
                              </button>
                              {userRole !== 'leerling' && (
                                <>
                                  <button onClick={() => startEditingMessage(i, h.content)} className="text-pink-300"><Pencil size={12}/></button>
                                  <button onClick={() => setDeleteConfirm({ type: 'chat_message', index: i, name: 'dit bericht' })} className="text-pink-300 hover:text-red-500"><Trash2 size={12}/></button>
                                </>
                              )}
                            </div>
                          </div>
                          <div className="cursor-pointer" onClick={() => toggleRomaji(`chat-${i}`, displayMode.romaji)}>
                            {displayMode.kana && <div className="text-lg font-medium">{h.content.kana}</div>}
                            {displayMode.kanji && displayMode.kana && h.content.kanji !== h.content.kana && <div className="text-xs opacity-60 mt-0.5">{h.content.kanji}</div>}
                            {!displayMode.kana && displayMode.kanji && <div className="text-lg">{h.content.kanji}</div>}
                          </div>
                          
                          {isRomajiVisible(`chat-${i}`, displayMode.romaji) && <div className={`text-xs italic font-medium mt-2 p-1.5 rounded-lg inline-block ${h.role==='user'?'bg-black/10':'bg-pink-50 text-pink-600'}`}>{h.content.romaji}</div>}
                          {displayMode.translation && h.content.translation && <div className={`font-bold mt-2 pt-2 border-t ${h.role==='user'?'border-white/20':'border-purple-100'}`}>{h.content.translation}</div>}
                        </>
                      )}
                    </div>
                  );
                })}
                {isLoading && <div className="text-pink-500 font-black text-xs p-3 bg-white w-max rounded-2xl border border-pink-100 shadow-sm flex items-center gap-2"><Loader2 className="animate-spin" size={16}/> {selectedCharacter.name} typt...</div>}
              </div>

              {/* Docent Controls: Send Input and AI Help */}
              {userRole !== 'leerling' && (
                <>
                  <div className="flex gap-2 mb-3">
                    <button onClick={generateSuggestions} disabled={isGeneratingSuggestions || isLoading} className="flex-1 text-[11px] font-black text-purple-600 bg-white border-b-4 border-purple-200 p-3 rounded-2xl flex justify-center items-center gap-1 shadow-sm uppercase">
                      {isGeneratingSuggestions ? <Loader2 className="animate-spin" size={16}/> : <Sparkles size={16} className="text-yellow-400"/>} Help me!
                    </button>
                    <button onClick={checkGrammar} disabled={isCheckingGrammar || isLoading || !inputText.trim()} className="flex-1 text-[11px] font-black text-blue-600 bg-white border-b-4 border-blue-200 p-3 rounded-2xl flex justify-center items-center gap-1 shadow-sm uppercase">
                      {isCheckingGrammar ? <Loader2 className="animate-spin" size={16}/> : <Wand2 size={16} className="text-blue-400"/>} Check zin
                    </button>
                  </div>
                  
                  <div className="flex gap-2 mb-5">
                    <input type="text" value={inputText} onChange={(e) => setInputText(e.target.value)} onKeyDown={(e) => e.key === 'Enter' && sendMessage()} placeholder="Typ in Romaji of NL..." className="flex-1 p-4 rounded-3xl border-2 border-purple-200 shadow-inner font-medium text-purple-900 bg-white" disabled={isLoading}/>
                    <button onClick={sendMessage} disabled={isLoading || !inputText.trim()} className="bg-gradient-to-r from-pink-400 to-purple-500 text-white p-4 rounded-3xl disabled:opacity-50 flex items-center justify-center min-w-[60px] shadow-md">
                      {isLoading ? <Loader2 className="animate-spin" size={24}/> : <Send size={24}/>}
                    </button>
                  </div>
                </>
              )}

              {/* Bottom Utility Bar */}
              <div className="flex flex-col gap-2 bg-white/80 p-4 rounded-3xl shadow-sm border border-purple-100 mb-5">
                <div className="flex justify-between items-center gap-2 flex-wrap">
                  <button onClick={extractVocabularyFromChat} disabled={isExtractingVocab || history.length < 2} className="text-[10px] font-black text-cyan-700 p-3 bg-cyan-50 rounded-2xl flex items-center gap-2 border border-cyan-200 shadow-sm uppercase flex-1 justify-center">
                    {isExtractingVocab ? <Loader2 className="animate-spin" size={16}/> : <BookOpen size={16}/>} Woorden Opslaan
                  </button>
                  
                  {userRole !== 'leerling' && (
                    <button onClick={saveCurrentDialogue} disabled={isSavingDialogue || history.length === 0} className="text-[10px] font-black text-emerald-700 p-3 bg-emerald-50 rounded-2xl flex items-center gap-2 border border-emerald-200 shadow-sm uppercase flex-1 justify-center">
                      {isSavingDialogue ? <Loader2 className="animate-spin" size={16}/> : <Save size={16}/>} Bewaar Chat
                    </button>
                  )}
                  
                  {isPlaying ? (
                    <button onClick={stopAudio} className="text-[10px] font-black text-rose-600 p-3 bg-rose-50 rounded-2xl flex items-center gap-2 border border-rose-200 shadow-sm uppercase flex-1 justify-center">
                      <StopCircle size={16}/> STOPPEN
                    </button>
                  ) : (
                    <button onClick={playFullDialogue} disabled={history.length === 0} className={`text-[10px] font-black ${userRole === 'leerling' ? 'text-teal-700 bg-teal-50 border-teal-200' : 'text-purple-700 bg-purple-50 border-purple-200'} p-3 rounded-2xl flex items-center gap-2 flex-1 justify-center border shadow-sm uppercase`}>
                      <PlayCircle size={16}/> SPEEL AF
                    </button>
                  )}
                </div>
                {vocabSuccessMessage && <div className="text-xs font-black text-cyan-600 bg-cyan-50 py-2 px-3 rounded-xl text-center mt-2 border border-cyan-100">{vocabSuccessMessage}</div>}
                {dialogueSuccessMsg && <div className="text-xs font-black text-emerald-600 bg-emerald-50 py-2 px-3 rounded-xl text-center mt-2 border border-emerald-100">{dialogueSuccessMsg}</div>}
              </div>
              
              {/* Evaluation Section */}
              <div className="mb-6">
                {evaluationResult ? (
                  <div className={`bg-gradient-to-br ${userRole === 'leerling' ? 'from-teal-50 to-emerald-50 border-teal-200' : 'from-yellow-50 to-orange-50 border-yellow-200'} border-2 p-5 rounded-3xl relative shadow-sm`}>
                    <button onClick={() => setEvaluationResult(null)} className={`absolute top-3 right-3 ${userRole === 'leerling' ? 'text-teal-400' : 'text-orange-400'} bg-white rounded-full p-1`}><X size={16}/></button>
                    
                    {userRole !== 'leerling' && (
                      <div className="flex items-center gap-2 mb-3 text-orange-600 font-black text-2xl">
                        <Award size={28} className="text-yellow-500 fill-yellow-500" /> Score: {evaluationResult.score}/10
                      </div>
                    )}
                    
                    <div className="text-sm text-slate-800 mb-4 font-medium">
                      <span className={`font-black ${userRole === 'leerling' ? 'text-teal-800' : 'text-orange-800'} block mb-1 uppercase text-xs`}>Feedback:</span>
                      {evaluationResult.feedback && evaluationResult.feedback.split('\n').map((para, idx) => para.trim() ? <p key={idx} className="mb-2 leading-relaxed">{para}</p> : null)}
                    </div>
                    
                    <div className={`text-sm bg-white p-4 rounded-2xl border ${userRole === 'leerling' ? 'border-teal-100' : 'border-yellow-100'} font-medium`}>
                      <span className={`font-black ${userRole === 'leerling' ? 'text-emerald-600' : 'text-red-500'} block mb-1 flex items-center gap-1 uppercase text-xs`}><Sparkles size={12}/> Handige tips:</span>
                      {evaluationResult.improvement && evaluationResult.improvement.split('\n').map((para, idx) => para.trim() ? <p key={idx} className="mb-2 leading-relaxed">{para}</p> : null)}
                    </div>
                  </div>
                ) : (
                  <button 
                    onClick={evaluateRoleplay} 
                    disabled={isEvaluating || history.length < 2} 
                    className={`w-full text-sm font-black ${
                      userRole === 'leerling' 
                        ? 'text-teal-800 bg-gradient-to-r from-teal-100 to-emerald-100 border-teal-300' 
                        : 'text-orange-600 bg-gradient-to-r from-yellow-100 to-orange-100 border-yellow-200'
                    } border-2 p-4 rounded-3xl flex justify-center items-center gap-2 shadow-sm uppercase tracking-wide`}
                  >
                    {isEvaluating ? <Loader2 className="animate-spin" size={20}/> : <Award size={20} className={userRole === 'leerling' ? 'text-teal-600' : 'text-orange-500'}/>}
                    ✨ {userRole === 'leerling' ? 'Over de dialoog' : 'Over je dialoog'}
                  </button>
                )}
              </div>

              {/* Copy / Export Section */}
              <div className={`bg-white/50 p-4 rounded-2xl shadow-sm border ${userRole === 'leerling' ? 'border-teal-100' : 'border-purple-100'} mb-6 text-[10px]`}>
                <div className="flex justify-between items-center cursor-pointer" onClick={() => setShowBackup(!showBackup)}>
                  <span className="font-black uppercase flex items-center gap-2 text-slate-500">
                    Toon Chatgeschiedenis als Tekst {showBackup ? '▼' : '▶'}
                  </span>
                  <button onClick={(e) => { 
                    e.stopPropagation(); 
                    const getLines = (mode) => history.map(h => (h.role === 'user' ? 'Ik: ' : selectedCharacter.name + ': ') + (h.content[mode] || '-')).join('\n'); 
                    const text = `KANJI:\n${getLines('kanji')}\n\nKANA:\n${getLines('kana')}\n\nROMAJI:\n${getLines('romaji')}\n\nVERTALING:\n${getLines('translation')}`; 
                    const textArea = document.createElement("textarea"); textArea.value = text;
                    document.body.appendChild(textArea); textArea.select();
                    try { 
                      document.execCommand('copy'); 
                      setIsCopied(true); 
                      showNotification("Dialoog gekopieerd naar klembord! 📋", "success");
                      setTimeout(() => setIsCopied(false), 2000); 
                    } catch (err) {} 
                    document.body.removeChild(textArea);
                  }} className={`${userRole === 'leerling' ? 'text-teal-600' : 'text-pink-500'} flex items-center gap-1 font-black uppercase bg-white px-2 py-1 rounded-lg`}>
                    {isCopied ? <span className="text-green-500 flex items-center gap-1">✓ Yep!</span> : <><Copy size={12}/> Kopieer</>}
                  </button>
                </div>
                {showBackup && (
                  <div className="space-y-4 mt-4 pt-4 border-t border-purple-100/50">
                    {['kanji', 'kana', 'romaji', 'translation'].map(mode => (
                      <div key={`backup-mode-${mode}`}>
                        <div className={`font-black ${userRole === 'leerling' ? 'text-teal-600' : 'text-pink-400'} uppercase border-b border-pink-100 mb-1`}>{mode}:</div>
                        {history.map((h, i) => <div key={`backup-line-${mode}-${i}`} className="text-slate-600 font-medium mb-0.5">{ (h.role === 'user' ? 'Ik: ' : selectedCharacter.name + ': ') + (h.content[mode] || '-') }</div>)}
                      </div>
                    ))}
                  </div>
                )}
              </div>
            </div>
          )}

          {/* Delete confirmation modal */}
          {deleteConfirm && (
            <div className="fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="bg-white p-6 rounded-3xl shadow-xl max-w-sm w-full border-4 border-pink-300">
                <div className="text-4xl text-center mb-3">🥺🎒</div>
                <h3 className="font-black text-xl text-purple-700 text-center mb-2">Weet je het zeker?</h3>
                <p className="text-slate-600 text-sm text-center mb-6">
                  Wil je <span className="font-bold text-pink-500">"{deleteConfirm.name}"</span> echt verwijderen?
                </p>
                <div className="flex gap-3">
                  <button onClick={() => setDeleteConfirm(null)} className="flex-1 bg-slate-100 text-slate-500 py-3 rounded-2xl font-bold text-sm">Annuleren</button>
                  <button 
                    onClick={() => {
                      if (deleteConfirm.type === 'dialogue') deleteDialogue(deleteConfirm.id);
                      else if (deleteConfirm.type === 'chat_message') deleteMessage(deleteConfirm.index);
                      else if (deleteConfirm.type === 'vocabulary') deleteWord(deleteConfirm.id);
                      setDeleteConfirm(null);
                    }} 
                    className="flex-1 bg-gradient-to-r from-red-400 to-pink-500 text-white py-3 rounded-2xl font-black text-sm"
                  >
                    Verwijder! 🗑️
                  </button>
                </div>
              </div>
            </div>
          )}
          
          <footer className="mt-auto py-6 text-[10px] text-slate-400 font-bold uppercase tracking-widest text-center w-full max-w-lg border-t border-purple-100">
            © w.oostindier@canvas-lab2026 <br/><span className={userRole === 'leerling' ? 'text-teal-400' : 'text-pink-300'}>Kawaii Editie v2.0</span>
          </footer>
        </div>
      );
    };

    const root = createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
